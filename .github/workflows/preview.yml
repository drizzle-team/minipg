# Publishes a preview build of every commit to pkg.pr.new, so a teammate can install an
# unreleased build without burning a version number or vendoring a tarball.
#
# PREREQUISITE: the pkg.pr.new GitHub App must be installed on this repository, or every
# publish step fails. https://github.com/apps/pkg-pr-new
#
# The install URL for each commit is written to the job summary, and to a PR comment when
# the run is for a pull request. Preview builds are not published to npm; the Publish
# workflow remains the only path to the registry.
name: Preview release

on:
  push:
    branches: ['**']
    tags: ['!**']
  pull_request:

# pkg.pr.new authenticates through its GitHub App and posts its PR comment as the app, so
# the workflow token only ever needs to read the repository for checkout.
permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # pkg-pr-new runs under node and shells out to `npm pack`.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      # The same fast gate the Publish workflow runs. A preview that does not typecheck,
      # build, pass the unit suite and survive the packaging checks is worse than no
      # preview: it looks installable and is not. The integration suite is deliberately
      # excluded — it needs a live cluster and a 20 minute job, which is too slow to sit
      # in front of every commit.
      - run: bun run typecheck
      - run: bun run build
      - run: bun test test/unit
      - run: bun run verify:publish

      # A preview-service outage must not turn the build red — the gates above already
      # decided whether the commit is good.
      # --previewVersion rewrites the published package.json version to 0.0.0-preview-<sha>.
      # Without it a preview keeps the source version, so a preview of 0.3.3 can settle into
      # a consumer's lockfile and shadow the real 0.3.3 once that ships to npm.
      - name: Publish preview to pkg.pr.new
        id: preview
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx pkg-pr-new publish --json preview.json --previewVersion --comment=update --packageManager=bun,npm
          else
            npx pkg-pr-new publish --json preview.json --previewVersion --comment=off --packageManager=bun,npm
          fi

      - name: Write install commands to the job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Preview release"
            echo
            if [ "${{ steps.preview.outcome }}" != "success" ]; then
              echo "Publishing to pkg.pr.new failed. The build and test gates above are unaffected —"
              echo "this commit is still good, there is just no preview build for it."
              echo
              echo "If this persists, check that the pkg.pr.new GitHub App is installed on this repository."
            elif [ -s preview.json ]; then
              echo "Install this commit directly:"
              echo
              echo '```sh'
              jq -r '.packages[] | "bun add \(.url)"' preview.json
              echo '```'
              echo
              # The version is derived from the URL pkg-pr-new actually returned rather than
              # reconstructed here — it abbreviates the commit hash itself, and guessing the
              # length would print a version that does not exist.
              echo "| Package | Version | URL |"
              echo "| --- | --- | --- |"
              jq -r '.packages[]
                     | "| `\(.name)` | `0.0.0-preview-\(.url | split("@") | last)` | \(.url) |"' preview.json
              echo
              echo "Built from \`${GITHUB_SHA}\`. Preview builds expire and are not a release —"
              echo "the version is rewritten to \`0.0.0-preview-<sha>\` so it can never be mistaken"
              echo "for the npm build of the same number."
            else
              echo "pkg.pr.new reported success but produced no metadata, so there is no install URL to show."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
